query CartInput {
  cart {
    # Set by the theme while a gift promo is in Preview mode (?gift_preview=1),
    # so the promo only runs for the merchant's own cart.
    giftPreview: attribute(key: "_gift_preview") {
      value
    }
    lines {
      id
      quantity
      cost {
        # In the cart's (presentment) currency: the price Shopify charges in
        # the customer's market, after price lists and rounding.
        amountPerQuantity {
          amount
          currencyCode
        }
        subtotalAmount {
          amount
        }
      }
      # Present on lines the theme added as free gifts: "tier:1".."tier:3" for
      # promo tiers, "vip:<code prefix>" for VIP code gifts.
      gift: attribute(key: "_gift") {
        value
      }
      # Present when the line is a subscription (Appstle selling plan). A
      # subscribed upsell product gets only the subscription price, never the
      # upsell deal on top.
      sellingPlanAllocation {
        sellingPlan {
          id
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            # A product is treated as an "upsell" (e.g. the wipes) when it has
            # this metafield. It's the same metafield the cart drawer reads to
            # show the deal price, so the charge and the display always match.
            upsellPrice: metafield(namespace: "custom", key: "upsell_price") {
              value
            }
          }
        }
      }
    }
  }
  shop {
    localTime {
      date
    }
    # Gift with purchase settings, saved by the discount's settings panel
    # (extensions/discount-ui). The theme reads the same metafield, so the cart
    # drawer and checkout always agree on the promo.
    giftPromo: metafield(namespace: "baudie", key: "gift_promo") {
      jsonValue
    }
    # The upsell offers, saved by the Upsell deals page. Its `shopCurrency` and
    # `basePrices` (each deal variant's shop-currency price) set the deal price
    # in other currencies; the cart drawer and checkout read the same metafield.
    upsellOffers: metafield(namespace: "baudie", key: "upsell_offers") {
      jsonValue
    }
  }
  # Codes the customer entered. While a gift promo runs, every one is rejected.
  enteredDiscountCodes {
    code
    rejectable
  }
  presentmentCurrencyRate
  discount {
    discountClasses
  }
}

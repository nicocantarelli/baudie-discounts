client_id = "79e64518019b8a455cf079bfaba17e1d"
name = "Baudie Gifts & Deals"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# write_discounts: create/manage the automatic discount that runs the function.
# write_products: the Upsell deals page edits each product's custom.upsell_price
# metafield (the function reads it).
scopes = "write_discounts,write_products"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]
